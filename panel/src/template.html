<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模型协同面板</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px 12px 20px;
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #18181b);
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif);
      font-size: 13px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

    /* Header */
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding-bottom: 10px; border-bottom: 1px solid var(--color-border-secondary, #e4e4e7);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-dot {
      width: 8px; height: 8px; border-radius: 999px; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #10b981);
      box-shadow: 0 0 0 3px color-mix(in srgb, #6366f1 16%, transparent);
    }
    .title { font-size: 14px; font-weight: 650; letter-spacing: -0.015em; }
    .topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .icon-btn {
      display: inline-flex; align-items: center; gap: 4px;
      height: 26px; padding: 0 9px; border-radius: 6px; font-size: 11px; font-weight: 500;
      border: 1px solid var(--color-border-primary, #e4e4e7);
      background: var(--color-background-secondary, #f4f4f5);
      color: var(--color-text-secondary, #52525b);
      cursor: pointer; transition: all 0.15s ease;
    }
    .icon-btn:hover:not(:disabled) { color: var(--color-text-primary, #18181b); border-color: var(--color-text-tertiary, #a1a1aa); }
    .icon-btn:disabled { opacity: 0.7; cursor: wait; }
    .spin-icon { width: 12px; height: 12px; flex-shrink: 0; }
    .spin-icon.spinning { animation: spin 0.85s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.58; } }
    .quota-card.refreshing { animation: pulse-soft 1.1s ease-in-out infinite; }

    /* Pills & Badges */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 550; padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--color-border-primary, #e4e4e7);
      background: var(--color-background-secondary, #f4f4f5);
      color: var(--color-text-secondary, #52525b);
      white-space: nowrap;
    }
    .pill.warn {
      background: color-mix(in srgb, #f59e0b 14%, transparent);
      color: var(--color-text-warning, #b45309);
      border-color: color-mix(in srgb, #f59e0b 35%, transparent);
    }
    .pill.ok {
      background: color-mix(in srgb, #10b981 14%, transparent);
      color: var(--color-text-success, #047857);
      border-color: color-mix(in srgb, #10b981 35%, transparent);
    }
    .pill.err {
      background: color-mix(in srgb, #ef4444 14%, transparent);
      color: var(--color-text-danger, #b91c1c);
      border-color: color-mix(in srgb, #ef4444 35%, transparent);
    }

    /* Section Headers */
    .sec-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 6px;
    }
    .sec-title {
      font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--color-text-secondary, #71717a);
    }
    .sec-sub { font-size: 11px; color: var(--color-text-tertiary, #a1a1aa); }

    /* Quota Bento Grid */
    .quota-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 340px) { .quota-grid { grid-template-columns: 1fr; } }
    .quota-card {
      position: relative; overflow: hidden;
      background: var(--color-background-secondary, #fafafa);
      border: 1px solid var(--color-border-primary, #e4e4e7);
      border-radius: 10px; padding: 10px 11px;
      display: flex; flex-direction: column; gap: 7px;
    }
    .quota-card::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    }
    .quota-card.codex::before { background: linear-gradient(90deg, #10b981, #14b8a6); }
    .quota-card.agy::before { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
    .quota-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .quota-name { font-size: 12px; font-weight: 650; }
    .quota-plan {
      font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 4px;
      background: var(--color-background-tertiary, #f4f4f5);
      color: var(--color-text-secondary, #52525b);
    }
    .quota-big { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
    .quota-num { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
    .quota-unit { font-size: 11px; color: var(--color-text-secondary, #71717a); }
    .bar-track {
      width: 100%; height: 6px; border-radius: 999px; overflow: hidden;
      background: var(--color-background-tertiary, #e4e4e7);
    }
    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
    .bar-fill.good { background: linear-gradient(90deg, #10b981, #34d399); }
    .bar-fill.mid { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .bar-fill.low { background: linear-gradient(90deg, #ef4444, #f87171); }
    .quota-foot { font-size: 11px; color: var(--color-text-secondary, #71717a); line-height: 1.35; }
    .sub-metric { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
    .sub-metric-row { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 11px; color: var(--color-text-secondary, #71717a); font-variant-numeric: tabular-nums; }
    .bar-track.thin { height: 4px; }
    .quota-warn { font-size: 10px; color: var(--color-text-warning, #b45309); }
    .stat-pair { display: flex; align-items: baseline; gap: 10px; }
    .stat-item { display: flex; align-items: baseline; gap: 3px; }
    .stat-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat-lbl { font-size: 11px; color: var(--color-text-secondary, #71717a); }

    /* Role Cards */
    .roles-list { display: flex; flex-direction: column; gap: 8px; }
    .role-card {
      position: relative;
      background: var(--color-background-secondary, #fafafa);
      border: 1px solid var(--color-border-primary, #e4e4e7);
      border-radius: 10px; padding: 10px 11px 10px 14px;
      display: flex; flex-direction: column; gap: 8px;
      transition: border-color 0.15s ease;
    }
    .role-card:hover { border-color: var(--color-text-tertiary, #a1a1aa); }
    .role-card::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0;
    }
    .role-card.accent-agy::before { background: #6366f1; }
    .role-card.accent-audit::before { background: #0ea5e9; }
    .role-card.accent-worker::before { background: #10b981; }
    .role-card.accent-hard::before { background: #f59e0b; }

    .role-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .role-name { font-size: 13px; font-weight: 650; }
    .role-desc { font-size: 11px; color: var(--color-text-secondary, #71717a); margin-top: -4px; }

    select, input[type="text"], input[type="number"] {
      width: 100%; height: 30px; padding: 0 9px; border-radius: 7px; font-size: 12px;
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #18181b);
      border: 1px solid var(--color-border-primary, #d4d4d8);
      outline: none; transition: border-color 0.15s ease;
    }
    select:focus, input:focus { border-color: var(--color-ring-primary, #6366f1); }

    /* Segmented Effort Control */
    .effort-row { display: flex; align-items: center; gap: 6px; }
    .effort-lbl { font-size: 11px; color: var(--color-text-secondary, #71717a); flex-shrink: 0; }
    .seg {
      display: flex; flex: 1; gap: 2px; padding: 2px; border-radius: 7px;
      background: var(--color-background-tertiary, #e4e4e7);
    }
    .seg-btn {
      flex: 1; height: 22px; padding: 0 4px; border: none; border-radius: 5px;
      font-size: 11px; font-weight: 500; cursor: pointer;
      background: transparent; color: var(--color-text-secondary, #52525b);
      transition: all 0.12s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .seg-btn:hover { color: var(--color-text-primary, #18181b); }
    .seg-btn[data-active="true"] {
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #18181b);
      font-weight: 650;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
    }

    /* Advanced collapsible */
    details.adv {
      background: var(--color-background-secondary, #fafafa);
      border: 1px solid var(--color-border-primary, #e4e4e7);
      border-radius: 10px; padding: 8px 11px;
    }
    details.adv summary {
      cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between;
      font-size: 12px; font-weight: 550; color: var(--color-text-secondary, #52525b);
    }
    details.adv summary::-webkit-details-marker { display: none; }
    .adv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .field-lbl { display: block; font-size: 11px; color: var(--color-text-secondary, #71717a); margin-bottom: 3px; }

    /* Save Bar */
    .save-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-radius: 10px;
      background: var(--color-background-secondary, #fafafa);
      border: 1px solid var(--color-border-primary, #e4e4e7);
    }
    .save-bar.dirty {
      border-color: color-mix(in srgb, #6366f1 45%, var(--color-border-primary, #e4e4e7));
    }
    .toast { font-size: 11px; font-weight: 550; color: var(--color-text-secondary, #71717a); }
    .toast.ok { color: var(--color-text-success, #047857); }
    .toast.err { color: var(--color-text-danger, #b91c1c); }
    .btn-primary {
      height: 30px; padding: 0 14px; border-radius: 7px; font-size: 12px; font-weight: 600;
      border: none; cursor: pointer;
      background: var(--color-background-inverse, #18181b);
      color: var(--color-text-inverse, #ffffff);
      transition: opacity 0.15s ease;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-ghost {
      height: 30px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 500;
      border: 1px solid var(--color-border-primary, #d4d4d8);
      background: var(--color-background-primary, #ffffff);
      color: var(--color-text-primary, #18181b);
      cursor: pointer; white-space: nowrap;
    }
    .btn-ghost:hover { border-color: var(--color-text-tertiary, #a1a1aa); }

    /* Handoff Card */
    .handoff-card {
      background: var(--color-background-secondary, #fafafa);
      border: 1px solid var(--color-border-primary, #e4e4e7);
      border-radius: 10px; padding: 10px 11px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .path-row { display: flex; gap: 6px; }
    .summary-box {
      white-space: pre-wrap; font-size: 12px; line-height: 1.55;
      padding: 9px 10px; border-radius: 8px;
      background: var(--color-background-primary, #ffffff);
      border: 1px solid var(--color-border-secondary, #e4e4e7);
      max-height: 150px; overflow-y: auto;
    }
    .footnote {
      font-size: 11px; color: var(--color-text-tertiary, #a1a1aa); line-height: 1.45;
      padding: 0 2px;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
  </style>
</head>
<body>
  <div class="wrap" id="root">
    <div class="sec-sub">正在加载模型协同面板…</div>
  </div>
  <!-- INLINE_SCRIPT -->
</body>
</html>
